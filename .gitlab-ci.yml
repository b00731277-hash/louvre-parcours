# Publie le site statique sur GitLab Pages à chaque push sur la branche par défaut.
# Le site n'a pas besoin d'être "construit" (pas de build) : on copie juste
# les fichiers existants dans le dossier "public" que GitLab Pages sert.
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r app public/app
    - cp -r data public/data
    - printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=app/index.html">' > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
